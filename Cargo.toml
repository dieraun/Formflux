[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "crates/cuda", "crates/cli", "crates/gui"]
default-members = ["crates/shared", "crates/core", "crates/cuda", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["dieraun"]
repository = "https://github.com/dieraun/Formflux"
homepage = "https://github.com/dieraun/Formflux"
description = "Offline, privacy-first multimedia and developer toolbox"
keywords = ["offline", "multimedia", "image", "converter", "toolbox"]
categories = ["command-line-utilities", "multimedia", "graphics"]

[workspace.dependencies]
formflux-shared = { path = "crates/shared" }
formflux-core = { path = "crates/core" }
formflux-cuda = { path = "crates/cuda" }

anyhow = "1.0"
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
csv = "1.3"
data-encoding = "2.6"
directories = "6.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
encoding_rs = "0.8"
font8x8 = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
md-5 = "0.10"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
quick-xml = "0.37"
rand = "0.8"
rayon = "1.10"
regex = "1.11"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
similar = "2.6"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
walkdir = "2.5"
which = "7.0"
zxcvbn = "3.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
