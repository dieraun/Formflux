[package]
name = "formflux-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Frontend-independent Formflux tool implementations"
repository.workspace = true

[features]
default = []
avif = ["image/avif"]
# HEIC and RAW are exposed as explicit build variants. They rely on external
# codecs (libheif / rawloader); see README.md before enabling them.
heic = []
raw = []
cuda = ["formflux-cuda/cuda"]

[dependencies]
formflux-shared.workspace = true
formflux-cuda.workspace = true

base64.workspace = true
blake2.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
