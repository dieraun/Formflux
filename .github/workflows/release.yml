name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: sh scripts/check-offline.sh

  deny:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  build:
    name: build ${{ matrix.name }}
    needs: [quality, deny]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: formflux-min-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            archive: zip
          - name: formflux-min-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: ""
            archive: tar.gz
          - name: formflux-min-macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
            archive: tar.gz
          - name: formflux-min-macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            features: ""
            archive: tar.gz
          - name: formflux-full-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "formflux-core/avif,formflux-core/cuda"
            archive: zip
          - name: formflux-full-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: "formflux-core/avif,formflux-core/cuda"
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          FLAGS="-C target-feature=+crt-static"
          if [ "${{ runner.os }}" = "Linux" ]; then
            FLAGS="$FLAGS -C link-arg=-static"
          fi
          RUSTFLAGS="$FLAGS" cargo build --release --locked \
            --target "${{ matrix.target }}" \
            --features "${{ matrix.features }}" \
            -p formflux-cli -p formflux-gui

      - name: Strip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for bin in formflux formflux-gui; do
            strip "target/${{ matrix.target }}/release/$bin" || true
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/formflux.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/formflux-gui.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.name }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/formflux" "target/${{ matrix.target }}/release/formflux-gui" dist/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.name }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            git log --pretty=format:"- %s (%h)" "$PREVIOUS..HEAD" > CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: CHANGELOG.md
          generate_release_notes: false

  # Linux release binaries are static musl builds.  Windows uses the static CRT
  # via +crt-static; macOS binaries are per-architecture single files.
