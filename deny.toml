[graph]
targets = []

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "NCSA",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "reqwest" },
  { name = "hyper" },
  { name = "hyper-util" },
  { name = "ureq" },
  { name = "curl" },
  { name = "isahc" },
  { name = "surf" },
  { name = "attohttpc" },
  { name = "awc" },
  { name = "tungstenite" },
  { name = "tokio-tungstenite" },
  { name = "rustls" },
  { name = "native-tls" },
  { name = "openssl" },
  { name = "analytics" },
  { name = "sentry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
